[project]
name = "contracts-api"
version = "0.1.0"
description = "ColombiaTIC Contracts — SECOP II search, RAG, and AI bid evaluator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "redis[hiredis]>=5.1.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "boto3>=1.35.0",
    "pyjwt>=2.9.0",
    "pdfplumber>=0.11.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
