# contracts.colombiatic.com.co — ColombiaTIC Contracts SECOP Intelligence
# Install: /etc/nginx/sites-available/contracts → sites-enabled/contracts
# SSL: certbot (Let's Encrypt, HTTP-01)
#
# Architecture (Vite SPA + FastAPI):
#   dist/          → served as static files by nginx (no Node.js process)
#   /api/v1/*      → FastAPI :8098 (SECOP search, RAG, evaluator)
#   /api/auth/*    → NestJS :3007  (shared auth, subscriptions, Wompi)
#   /healthz       → nginx inline (load balancer probe)

server {
    listen 80;
    listen [::]:80;
    server_name contracts.colombiatic.com.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name contracts.colombiatic.com.co;

    ssl_certificate     /etc/letsencrypt/live/contracts.colombiatic.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contracts.colombiatic.com.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/contracts-web/dist;
    index index.html;

    client_max_body_size 15m;

    # Shared proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    # ---- Health check (nginx inline — no backend needed) ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- Contracts API (FastAPI :8098) ----
    location /api/v1/ {
        proxy_pass         http://127.0.0.1:8100;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass  http://127.0.0.1:8100;
        access_log  off;
    }

    location /readyz {
        proxy_pass  http://127.0.0.1:8100;
        access_log  off;
    }

    # ---- RealCulture (NestJS :3007) — auth/users/subscriptions/wompi ----
    # nginx injects X-Tenant-ID to prevent client-side spoofing
    location /api/auth/ {
        proxy_pass           http://127.0.0.1:3007;
        proxy_set_header     X-Tenant-ID contracts;
        proxy_read_timeout   30s;
    }

    location /api/users/ {
        proxy_pass           http://127.0.0.1:3007;
        proxy_set_header     X-Tenant-ID contracts;
        proxy_read_timeout   30s;
    }

    location /api/subscriptions/ {
        proxy_pass           http://127.0.0.1:3007;
        proxy_set_header     X-Tenant-ID contracts;
        proxy_read_timeout   30s;
    }

    location /api/payments/ {
        proxy_pass           http://127.0.0.1:3007;
        proxy_set_header     X-Tenant-ID contracts;
        proxy_read_timeout   60s;
    }

    location /api/webhook/ {
        proxy_pass           http://127.0.0.1:3007;
        proxy_set_header     X-Tenant-ID contracts;
        proxy_read_timeout   30s;
    }

    location /api/wompi/ {
        proxy_pass           http://127.0.0.1:3007;
        proxy_set_header     X-Tenant-ID contracts;
        proxy_read_timeout   30s;
    }

    # ---- Static assets (Vite build output) — aggressive cache ----
    location /assets/ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
        try_files   $uri =404;
    }

    # ---- SPA fallback — all unmatched routes serve index.html ----
    # React Router handles client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        expires   -1;
        add_header Cache-Control "no-cache";
    }
}
