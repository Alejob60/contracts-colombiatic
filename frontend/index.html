    <script type="application/ld+json">
    {

      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Qué es SECOP II?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SECOP II es el Sistema Electrónico de Contratación Pública de Colombia, la plataforma transaccional donde las entidades públicas publican sus procesos de licitación. Tiene más de 5 millones de procesos registrados."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo encuentro licitaciones en SECOP II para mi empresa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "En ColombiaTIC Contracts puedes buscar en 5M+ procesos de SECOP II filtrando por actividad económica, departamento, modalidad y presupuesto. El sistema calcula automáticamente un Match Score para indicar qué tan compatible es cada licitación con tu empresa. 3 búsquedas gratuitas por día, sin registro."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo sincronizo SECOP II con SIA OBSERVA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El módulo Reportar (próximamente disponible en Plan PRO) automatiza el reporte mensual SECOP II → SIA OBSERVA. Lee tus contratos activos en SECOP II, prelllena los campos obligatorios de SIA OBSERVA y te avisa si hay discrepancias antes de cerrar el reporte."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto cuesta ColombiaTIC Contracts?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El Plan PRO Licitador cuesta $149.000 COP por mes o $1.431.600 COP por año (20% de descuento). Incluye búsquedas ilimitadas, evaluador IA, alertas por WhatsApp, RAG corporativo y sincronización SIA OBSERVA. Hay 3 búsquedas gratuitas por día sin necesidad de registro."
          }
        }
      ]
    }
